version: "3"

services:
  # Web app in Python 
  web: # Name of the service
    build: . # Path of the location where Dockerfile and compose.yml are
    ports:
      - 8000:8000
    volumes:
      - .:/app
      - application-logs:/app/logs
    networks:
      - my-network
    environment:
      - REDIS_HOST=redis-db
    depends_on:
      - redis-db # Waits for redis-db to be up and running
  redis-db:
    image: "redis:7-alpine"
    volumes:
      - redis-data:/data
    networks:
      - my-network
networks:
  my-network:
    driver: bridge
volumes:
  application-logs:
  redis-data: